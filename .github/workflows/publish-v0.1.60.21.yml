name: Publish GlucoTrail 0.1.60.21
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.1.60.21.yml'
permissions:
  contents: read
concurrency:
  group: publish-glucotrail-v0.1.60.21
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Confirm intended version and prevent duplicate releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'versionName[[:space:]]*=[[:space:]]*"0\.1\.60\.21"' app/build.gradle.kts
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*100' app/build.gradle.kts
          if gh release view v0.1.60.21 >/dev/null 2>&1; then
            echo "::error::v0.1.60.21 already has a release; refusing overwrite."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require existing signing key, never generate another
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.GLUCOTRAIL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GLUCOTRAIL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GLUCOTRAIL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GLUCOTRAIL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing original signing credentials; cannot release an in-place update."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glucotrail.jks"
          chmod 600 "$RUNNER_TEMP/glucotrail.jks"
      - name: Test and build signed release
        env:
          GLUCOTRAIL_KEYSTORE: ${{ runner.temp }}/glucotrail.jks
          GLUCOTRAIL_STORE_PASSWORD: ${{ secrets.GLUCOTRAIL_STORE_PASSWORD }}
          GLUCOTRAIL_KEY_ALIAS: ${{ secrets.GLUCOTRAIL_KEY_ALIAS }}
          GLUCOTRAIL_KEY_PASSWORD: ${{ secrets.GLUCOTRAIL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py'
          sh ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Verify APK signature and create updater assets
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          python3 tools/package_release.py v0.1.60.21
          test -f dist/GlucoTrail-v0.1.60.21.apk
          test -f dist/GlucoTrail-v0.1.60.21.apk.sha256
          test -f dist/update.json
      - name: Publish public release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## GlucoTrail 0.1.60.21
          - Adds experimental two-sensor overlap tracking, individual and comparison graphs.
          - Adds replacement sensor activation, manual and opt-in automatic primary handover.
          - Adds fingerstick-assisted comparison and per-sensor display adjustment history.
          - Tracks observed old sensor lifetime and final verified reading.

          **Important:** Dual AiDEX X sensor operation, background continuity, and automatic handover have not yet been validated with two physical sensors. Automatic handover defaults to off. Continue using manufacturer-approved monitoring and confirm unexpected readings with a fingerstick meter. The app does not extend sensor expiry or automatically calibrate from an aging CGM.
          NOTES
          gh release create v0.1.60.21 dist/GlucoTrail-v0.1.60.21.apk dist/GlucoTrail-v0.1.60.21.apk.sha256 dist/update.json \
            --target "$GITHUB_SHA" --title 'GlucoTrail v0.1.60.21' --notes-file "$RUNNER_TEMP/release-notes.md" --latest
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/glucotrail.jks"
