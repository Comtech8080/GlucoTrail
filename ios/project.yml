name: GlucoTrail
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.7.0'
    CURRENT_PROJECT_VERSION: 7
packages:
  GlucoTrailProtocol:
    path: .
targets:
  GlucoTrail:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: Generated-Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central]
    dependencies:
      - package: GlucoTrailProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glucotrail.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GlucoTrail
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: GlucoTrail uses Bluetooth for foreground sensor readings and optional experimental background connection recovery.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  GlucoTrailAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: GlucoTrail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glucotrail.ios.apptests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GlucoTrail.app/GlucoTrail"
        BUNDLE_LOADER: "$(TEST_HOST)"
  GlucoTrailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GlucoTrail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glucotrail.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GlucoTrail:
    build:
      targets:
        GlucoTrail: all
    test:
      targets:
        - GlucoTrailAppTests
        - GlucoTrailUITests
